[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reagents"
version = "0.1.0"
description = "God-to-demigod orchestration for biology problems in invented representation domains"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
reagents = "reagents.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
