[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reagents"
version = "0.1.0"
description = "God-to-demigod orchestration for biology problems in invented representation domains"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.27,<2", "httpx>=0.28,<1"]
reasoning = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "sympy>=1.13,<2",
    "networkx>=3.3,<4",
    "pint>=0.24,<1",
    "cvxpy>=1.6,<2",
    # 4.16 ARM wheels require macOS 15; 4.15.4 supports macOS 13+.
    "z3-solver>=4.15.4,<4.15.5",
    "control>=0.10,<1",
]
biology = [
    "biopython>=1.84,<2",
    "rdkit>=2025.3,<2027",
    "cobra>=0.29,<1",
    "scanpy>=1.11,<2",
    "pymc>=5.20,<6",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.6,<2",
]
engineering = [
    "cantera>=3.1,<4",
    "openmm>=8.2,<9",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
reagents = "reagents.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
